<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="1200" height="350">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#050b18;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0a1628;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#050b18;stop-opacity:1" />
    </linearGradient>

    <!-- Cyan glow filter -->
    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Strong glow for title -->
    <filter id="glowStrong" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft glow for subtitle -->
    <filter id="glowSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Title text gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00e5ff"/>
      <stop offset="40%" style="stop-color:#ffffff"/>
      <stop offset="70%" style="stop-color:#00e5ff"/>
      <stop offset="100%" style="stop-color:#7c4dff"/>
    </linearGradient>

    <!-- Accent line gradient -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c4dff;stop-opacity:0"/>
      <stop offset="30%" style="stop-color:#00e5ff;stop-opacity:1"/>
      <stop offset="70%" style="stop-color:#00e5ff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#7c4dff;stop-opacity:0"/>
    </linearGradient>

    <!-- Hexagon pattern -->
    <pattern id="hexPattern" x="0" y="0" width="60" height="52" patternUnits="userSpaceOnUse">
      <polygon points="30,2 55,16 55,36 30,50 5,36 5,16" fill="none" stroke="#00e5ff" stroke-width="0.3" stroke-opacity="0.12"/>
    </pattern>

    <!-- Corner glow radial -->
    <radialGradient id="cornerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00e5ff;stop-opacity:0.18"/>
      <stop offset="100%" style="stop-color:#00e5ff;stop-opacity:0"/>
    </radialGradient>

    <!-- Orb gradient for the left hex icon -->
    <radialGradient id="orbGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" style="stop-color:#00e5ff;stop-opacity:0.9"/>
      <stop offset="60%" style="stop-color:#0090a0;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#001a2e;stop-opacity:0.8"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="350" fill="url(#bgGrad)" rx="16"/>

  <!-- Hexagon grid overlay -->
  <rect width="1200" height="350" fill="url(#hexPattern)" rx="16" opacity="0.6"/>

  <!-- Corner glow blobs -->
  <ellipse cx="0" cy="0" rx="280" ry="180" fill="url(#cornerGlow)" opacity="0.6"/>
  <ellipse cx="1200" cy="350" rx="280" ry="180" fill="url(#cornerGlow)" opacity="0.5"/>
  <ellipse cx="600" cy="175" rx="300" ry="160" fill="#00e5ff" fill-opacity="0.025"/>

  <!-- Outer border with glow -->
  <rect x="2" y="2" width="1196" height="346" fill="none" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.25" rx="15"/>
  <rect x="6" y="6" width="1188" height="338" fill="none" stroke="#7c4dff" stroke-width="0.5" stroke-opacity="0.2" rx="13"/>

  <!-- Top scanning line animation -->
  <line x1="40" y1="32" x2="1160" y2="32" stroke="url(#lineGrad)" stroke-width="1" opacity="0.5"/>
  <line x1="40" y1="318" x2="1160" y2="318" stroke="url(#lineGrad)" stroke-width="1" opacity="0.5"/>

  <!-- Left vertical accent bars -->
  <rect x="28" y="60" width="2" height="230" fill="url(#lineGrad)" rx="1" transform="rotate(90, 130, 175)"/>

  <!-- ====== HEX ICON ====== -->
  <g transform="translate(110, 175)" filter="url(#glowCyan)">
    <!-- Outer hex ring -->
    <polygon points="0,-72 62,-36 62,36 0,72 -62,36 -62,-36"
             fill="none" stroke="#00e5ff" stroke-width="1.5" stroke-opacity="0.6"/>
    <!-- Inner hex -->
    <polygon points="0,-54 47,-27 47,27 0,54 -47,27 -47,-27"
             fill="url(#orbGrad)" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.8"/>
    <!-- Inner hex glow -->
    <polygon points="0,-54 47,-27 47,27 0,54 -47,27 -47,-27"
             fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.3"/>

    <!-- N letter inside hex -->
    <text x="0" y="22" font-family="'Segoe UI', Arial Black, sans-serif" font-size="62"
          font-weight="900" text-anchor="middle" fill="#ffffff" filter="url(#glowStrong)"
          letter-spacing="-2">N</text>

    <!-- Small corner dots on hex vertices -->
    <circle cx="0" cy="-72" r="3" fill="#00e5ff" opacity="0.9"/>
    <circle cx="62" cy="-36" r="3" fill="#00e5ff" opacity="0.9"/>
    <circle cx="62" cy="36" r="3" fill="#00e5ff" opacity="0.9"/>
    <circle cx="0" cy="72" r="3" fill="#00e5ff" opacity="0.9"/>
    <circle cx="-62" cy="36" r="3" fill="#00e5ff" opacity="0.9"/>
    <circle cx="-62" cy="-36" r="3" fill="#00e5ff" opacity="0.9"/>
  </g>

  <!-- ====== MAIN TEXT BLOCK ====== -->
  <!-- Vertical divider line -->
  <line x1="220" y1="80" x2="220" y2="270" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.35"/>

  <!-- NEXUS title -->
  <text x="250" y="175" font-family="'Segoe UI', 'Arial Black', Impact, sans-serif"
        font-size="110" font-weight="900" letter-spacing="8"
        fill="url(#titleGrad)" filter="url(#glowStrong)"
        dominant-baseline="middle">NEXUS</text>

  <!-- MD badge pill -->
  <rect x="850" y="128" width="90" height="46" rx="8"
        fill="#00e5ff" fill-opacity="0.12"
        stroke="#00e5ff" stroke-width="1.5" stroke-opacity="0.7"/>
  <text x="895" y="158" font-family="'Segoe UI', Arial, sans-serif"
        font-size="26" font-weight="700" text-anchor="middle"
        fill="#00e5ff" filter="url(#glowSoft)" letter-spacing="2">MD</text>

  <!-- Tagline -->
  <text x="252" y="224" font-family="'Segoe UI', Arial, sans-serif"
        font-size="18" letter-spacing="5" fill="#a0d8ef"
        filter="url(#glowSoft)">WHATSAPP AUTOMATION ENGINE</text>

  <!-- Bottom accent line under tagline -->
  <line x1="252" y1="238" x2="940" y2="238" stroke="url(#lineGrad)" stroke-width="1" opacity="0.4"/>

  <!-- ====== STATUS CHIPS ====== -->
  <!-- Chip 1 -->
  <rect x="252" y="256" width="130" height="30" rx="15"
        fill="#00e5ff" fill-opacity="0.1" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.5"/>
  <circle cx="273" cy="271" r="5" fill="#00ff88"/>
  <text x="285" y="276" font-family="'Segoe UI', Arial, sans-serif"
        font-size="12" fill="#cce8ff" letter-spacing="1">ONLINE</text>

  <!-- Chip 2 -->
  <rect x="396" y="256" width="165" height="30" rx="15"
        fill="#7c4dff" fill-opacity="0.12" stroke="#7c4dff" stroke-width="1" stroke-opacity="0.5"/>
  <text x="478" y="276" font-family="'Segoe UI', Arial, sans-serif"
        font-size="12" fill="#c5b8ff" text-anchor="middle" letter-spacing="1">BAILEYS v7</text>

  <!-- Chip 3 -->
  <rect x="575" y="256" width="150" height="30" rx="15"
        fill="#00e5ff" fill-opacity="0.08" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.4"/>
  <text x="650" y="276" font-family="'Segoe UI', Arial, sans-serif"
        font-size="12" fill="#a0d8ef" text-anchor="middle" letter-spacing="1">OPEN SOURCE</text>

  <!-- ====== RIGHT DECORATION ====== -->
  <!-- Right large ring -->
  <circle cx="1080" cy="175" r="110" fill="none" stroke="#00e5ff" stroke-width="0.6" stroke-opacity="0.18"/>
  <circle cx="1080" cy="175" r="85" fill="none" stroke="#7c4dff" stroke-width="0.6" stroke-opacity="0.18"/>
  <circle cx="1080" cy="175" r="60" fill="none" stroke="#00e5ff" stroke-width="0.6" stroke-opacity="0.15"/>

  <!-- Dot grid on right -->
  <g opacity="0.3">
    <circle cx="1020" cy="115" r="2" fill="#00e5ff"/>
    <circle cx="1040" cy="115" r="2" fill="#00e5ff"/>
    <circle cx="1060" cy="115" r="2" fill="#00e5ff"/>
    <circle cx="1080" cy="115" r="2" fill="#00e5ff"/>
    <circle cx="1100" cy="115" r="2" fill="#00e5ff"/>
    <circle cx="1120" cy="115" r="2" fill="#00e5ff"/>
    <circle cx="1020" cy="135" r="2" fill="#7c4dff"/>
    <circle cx="1040" cy="135" r="2" fill="#7c4dff"/>
    <circle cx="1060" cy="135" r="2" fill="#7c4dff"/>
    <circle cx="1080" cy="135" r="2" fill="#7c4dff"/>
    <circle cx="1100" cy="135" r="2" fill="#7c4dff"/>
    <circle cx="1120" cy="135" r="2" fill="#7c4dff"/>
    <circle cx="1020" cy="215" r="2" fill="#7c4dff"/>
    <circle cx="1040" cy="215" r="2" fill="#7c4dff"/>
    <circle cx="1060" cy="215" r="2" fill="#7c4dff"/>
    <circle cx="1080" cy="215" r="2" fill="#7c4dff"/>
    <circle cx="1100" cy="215" r="2" fill="#7c4dff"/>
    <circle cx="1120" cy="215" r="2" fill="#7c4dff"/>
    <circle cx="1020" cy="235" r="2" fill="#00e5ff"/>
    <circle cx="1040" cy="235" r="2" fill="#00e5ff"/>
    <circle cx="1060" cy="235" r="2" fill="#00e5ff"/>
    <circle cx="1080" cy="235" r="2" fill="#00e5ff"/>
    <circle cx="1100" cy="235" r="2" fill="#00e5ff"/>
    <circle cx="1120" cy="235" r="2" fill="#00e5ff"/>
  </g>

  <!-- Center pulsing dot in ring -->
  <circle cx="1080" cy="175" r="8" fill="#00e5ff" opacity="0.9" filter="url(#glowCyan)"/>
  <circle cx="1080" cy="175" r="4" fill="#ffffff"/>

  <!-- Cross-hairs on center dot -->
  <line x1="1080" y1="155" x2="1080" y2="165" stroke="#00e5ff" stroke-width="1" opacity="0.7"/>
  <line x1="1080" y1="185" x2="1080" y2="195" stroke="#00e5ff" stroke-width="1" opacity="0.7"/>
  <line x1="1060" y1="175" x2="1070" y2="175" stroke="#00e5ff" stroke-width="1" opacity="0.7"/>
  <line x1="1090" y1="175" x2="1100" y2="175" stroke="#00e5ff" stroke-width="1" opacity="0.7"/>

  <!-- Version tag -->
  <text x="1080" y="302" font-family="'Segoe UI', Arial, sans-serif"
        font-size="11" fill="#00e5ff" text-anchor="middle"
        opacity="0.6" letter-spacing="2">v1.0.3</text>
</svg>
